<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOCITY STREAMS — Motorcycle Flow Field</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --gold: #c9a84c;
            --orange: #d97757;
            --blue: #6a9bcc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 320px;
            background: rgba(17,17,24,0.95);
            padding: 32px;
            border-right: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .control-section {
            margin-bottom: 28px;
        }

        .control-section h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '';
            width: 8px;
            height: 2px;
            background: var(--gold);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 2px;
            background: #333;
            border-radius: 1px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #666;
            min-width: 50px;
            text-align: right;
        }

        .seed-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #fff;
            text-align: center;
            margin-bottom: 12px;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn.primary {
            background: var(--gold);
            border-color: var(--gold);
            color: #0a0a0f;
        }

        .btn.primary:hover {
            background: #d4b65f;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        #canvas-container {
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        #canvas-container canvas {
            display: block;
        }

        .loading {
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 0.2em;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>VELOCITY STREAMS</h1>
        <div class="subtitle">Motorcycle Flow Field</div>

        <div class="control-section">
            <h3>Seed</h3>
            <input type="number" id="seed-input" class="seed-input" value="10000" onchange="updateSeed()">
            <div class="btn-row">
                <button class="btn" onclick="previousSeed()">← Prev</button>
                <button class="btn" onclick="nextSeed()">Next →</button>
            </div>
            <button class="btn primary" onclick="randomSeedAndUpdate()">↻ Random</button>
        </div>

        <div class="control-section">
            <h3>Parameters</h3>
            
            <div class="control-group">
                <label>Particle Count</label>
                <div class="slider-container">
                    <input type="range" id="particleCount" min="2000" max="15000" step="500" value="8000" oninput="updateParam('particleCount', this.value)">
                    <span class="value-display" id="particleCount-value">8000</span>
                </div>
            </div>

            <div class="control-group">
                <label>Flow Speed</label>
                <div class="slider-container">
                    <input type="range" id="flowSpeed" min="0.2" max="3.0" step="0.1" value="1.2" oninput="updateParam('flowSpeed', this.value)">
                    <span class="value-display" id="flowSpeed-value">1.2</span>
                </div>
            </div>

            <div class="control-group">
                <label>Noise Scale</label>
                <div class="slider-container">
                    <input type="range" id="noiseScale" min="0.001" max="0.01" step="0.001" value="0.003" oninput="updateParam('noiseScale', this.value)">
                    <span class="value-display" id="noiseScale-value">0.003</span>
                </div>
            </div>

            <div class="control-group">
                <label>Trail Length</label>
                <div class="slider-container">
                    <input type="range" id="trailLength" min="2" max="25" step="1" value="12" oninput="updateParam('trailLength', this.value)">
                    <span class="value-display" id="trailLength-value">12</span>
                </div>
            </div>

            <div class="control-group">
                <label>Turbulence</label>
                <div class="slider-container">
                    <input type="range" id="turbulence" min="0" max="2" step="0.1" value="0.5" oninput="updateParam('turbulence', this.value)">
                    <span class="value-display" id="turbulence-value">0.5</span>
                </div>
            </div>
        </div>

        <div class="control-section">
            <h3>Colors</h3>
            
            <div class="control-group">
                <label>Primary (Gold)</label>
                <div class="slider-container">
                    <input type="color" id="color1" value="#c9a84c" onchange="updateColor(0, this.value)">
                    <span class="value-display" id="color1-value">#c9a84c</span>
                </div>
            </div>

            <div class="control-group">
                <label>Secondary (Orange)</label>
                <div class="slider-container">
                    <input type="color" id="color2" value="#d97757" onchange="updateColor(1, this.value)">
                    <span class="value-display" id="color2-value">#d97757</span>
                </div>
            </div>

            <div class="control-group">
                <label>Accent (Blue)</label>
                <div class="slider-container">
                    <input type="color" id="color3" value="#6a9bcc" onchange="updateColor(2, this.value)">
                    <span class="value-display" id="color3-value">#6a9bcc</span>
                </div>
            </div>
        </div>

        <div class="control-section">
            <button class="btn primary" onclick="resetParameters()" style="width:100%">Reset All</button>
        </div>
    </div>

    <div class="canvas-area">
        <div id="canvas-container">
            <div class="loading">INITIALIZING VELOCITY FIELD...</div>
        </div>
    </div>

    <script>
        let params = {
            seed: 10000,
            particleCount: 8000,
            flowSpeed: 1.2,
            noiseScale: 0.003,
            trailLength: 12,
            turbulence: 0.5,
            colors: ['#c9a84c', '#d97757', '#6a9bcc']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));
        let particles = [];
        let cols, rows;
        let scl = 15;
        let flowField;
        let zoff = 0;

        function setup() {
            let canvas = createCanvas(windowWidth - 320, windowHeight);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function windowResized() {
            resizeCanvas(windowWidth - 320, windowHeight);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }

            cols = floor(width / scl);
            rows = floor(height / scl);
            flowField = new Array(cols * rows);
            
            background(10, 10, 15);
            zoff = 0;
        }

        function generateFlowField() {
            let yoff = 0;
            for (let y = 0; y < rows; y++) {
                let xoff = 0;
                for (let x = 0; x < cols; x++) {
                    let index = x + y * cols;
                    let angle = noise(xoff, yoff, zoff) * TWO_PI * 2;
                    let v = p5.Vector.fromAngle(angle);
                    v.setMag(params.flowSpeed);
                    flowField[index] = v;
                    xoff += params.noiseScale * 100;
                }
                yoff += params.noiseScale * 100;
            }
            zoff += 0.01;
        }

        function draw() {
            generateFlowField();

            // Subtle fade for trails
            noStroke();
            fill(10, 10, 15, 8);
            rect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].follow(flowField);
                particles[i].update();
                particles[i].edges();
                particles[i].display();
            }
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = random(2, 4);
                this.prevPos = this.pos.copy();
                this.colorIndex = floor(random(3));
                this.trailHistory = [];
            }

            follow(flow) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let index = x + y * cols;
                if (flow[index]) {
                    let force = flow[index].copy();
                    
                    // Add turbulence
                    let turb = noise(this.pos.x * 0.01, this.pos.y * 0.01, zoff) * params.turbulence;
                    force.rotate(turb);
                    
                    this.acc.add(force);
                }
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);
                
                this.trailHistory.push(this.pos.copy());
                if (this.trailHistory.length > params.trailLength) {
                    this.trailHistory.shift();
                }
            }

            display() {
                let speed = this.vel.mag();
                let alpha = map(speed, 0, 4, 50, 200);
                
                let col = color(params.colors[this.colorIndex]);
                
                // Draw trail
                if (this.trailHistory.length > 1) {
                    for (let i = 0; i < this.trailHistory.length - 1; i++) {
                        let t = i / this.trailHistory.length;
                        let trailAlpha = alpha * t * 0.6;
                        stroke(red(col), green(col), blue(col), trailAlpha);
                        strokeWeight(map(t, 0, 1, 0.5, 2));
                        line(
                            this.trailHistory[i].x, this.trailHistory[i].y,
                            this.trailHistory[i + 1].x, this.trailHistory[i + 1].y
                        );
                    }
                }
                
                // Draw point
                noStroke();
                fill(red(col), green(col), blue(col), alpha);
                ellipse(this.pos.x, this.pos.y, 2, 2);
            }

            edges() {
                if (this.pos.x > width) {
                    this.pos.x = 0;
                    this.prevPos = this.pos.copy();
                    this.trailHistory = [];
                }
                if (this.pos.x < 0) {
                    this.pos.x = width;
                    this.prevPos = this.pos.copy();
                    this.trailHistory = [];
                }
                if (this.pos.y > height) {
                    this.pos.y = 0;
                    this.prevPos = this.pos.copy();
                    this.trailHistory = [];
                }
                if (this.pos.y < 0) {
                    this.pos.y = height;
                    this.prevPos = this.pos.copy();
                    this.trailHistory = [];
                }
            }
        }

        // UI Functions
        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent = value;
            if (name === 'particleCount') {
                initializeSystem();
            }
        }

        function updateColor(index, value) {
            params.colors[index] = value;
            document.getElementById('color' + (index + 1) + '-value').textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed++;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            updateSeedDisplay();
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('trailLength').value = params.trailLength;
            document.getElementById('trailLength-value').textContent = params.trailLength;
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence;
            document.getElementById('color1').value = params.colors[0];
            document.getElementById('color1-value').textContent = params.colors[0];
            document.getElementById('color2').value = params.colors[1];
            document.getElementById('color2-value').textContent = params.colors[1];
            document.getElementById('color3').value = params.colors[2];
            document.getElementById('color3-value').textContent = params.colors[2];
            initializeSystem();
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
